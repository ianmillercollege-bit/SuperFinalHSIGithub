# Continuous integration for CIRQO.
#
# Runs on every push and every pull request. Two independent jobs:
#   backend  - installs Python deps and runs the pytest suite in mock mode
#   frontend - installs Node deps and builds the Next.js app in mock mode
# Both jobs must pass for the workflow (and the README badge) to show green.

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Keep tests fully offline: no live AI calls, no API key required.
      MOCK_MODE: "true"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Bake the public API address into the build and use bundled mock data
      # so the build never needs the live backend to be awake.
      NEXT_PUBLIC_API_URL: https://frontdoor-api-hiel.onrender.com
      NEXT_PUBLIC_USE_MOCK: "true"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Build the Next.js app
        run: npm run build
